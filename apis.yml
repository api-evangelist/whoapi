description: >-
  WhoAPI (founded 2011, WhoAPI Inc.) is a domain-intelligence API company that
  exposes WHOIS records, real-time domain availability across hundreds of TLDs,
  domain age, domain reputation/score, SSL certificate inspection, email score,
  IP/domain blacklist checks, and website screenshots through a single
  key-authenticated REST endpoint (api.whoapi.com). Every request is an HTTP GET
  selecting a task with the `r` parameter and returning gzip-compressed JSON with
  a numeric `status` and human-readable `status_desc`. It serves cybersecurity
  teams, domain registrars, SEO agencies, and fraud-detection systems, with
  first-party and community SDKs for Ruby, Python, Go, and R.
