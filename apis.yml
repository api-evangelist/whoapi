apis:
- aid: whoapi:whoapi-domain-intelligence-api
  name: WhoAPI Domain Intelligence API
  description: >-
    A single HTTP GET endpoint (api.whoapi.com) exposing nine domain-intelligence
    tasks selected by the `r` query parameter — whois, taken (availability), cert
    (SSL), domainscore and domainscore-check, emailscore and emailscore-check,
    blacklist, and screenshot. Authenticated with an `apikey` query parameter and
    optional IP whitelisting. Responses are gzip-compressed JSON carrying a
    numeric `status`; errors are returned in-band with HTTP 200. The two scoring
    tasks are asynchronous and accept a `webhook_url` callback parameter.
  humanURL: https://whoapi.com/api-documentation/
  baseURL: https://api.whoapi.com/
