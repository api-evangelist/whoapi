note: >-
  DECAY FINDING. Every WhoAPI client library — first-party and community — was
  last released between 2015 and 2016. The R client was ARCHIVED by CRAN on
  2021-02-16 at the maintainer's request. The Python distribution's release
  metadata still lists 0.1.2 but PyPI now serves NO files for any release, so
  `pip install whoapi` cannot resolve a distribution. The Ruby gem sits at
  0.1.0 from 2016-01-18 with no tags, even though its repository received a
  commit in 2023. The API itself is actively sold and actively documented (see
  plans/whoapi-plans-pricing.yml, priced through 2026), so the client layer is
  roughly a decade behind the product it wraps: none of these SDKs know about
  the domain-age, domain-score, email-score or webhook surfaces WhoAPI sells
  today. There is no npm, Packagist, Maven, NuGet or crates.io package.
