note: >-
  WhoAPI prices each of its seven APIs SEPARATELY — there is no single account
  plan. A customer subscribes per API and may combine subscriptions (confirmed
  on the FAQ: "you can combine as many API subscriptions as you want"). Quotas
  are monthly request allowances; there is no published per-request overage
  rate — exceeding the allowance returns status 36 ("You run out of monthly
  requests. Query limit exceeded.") rather than billing extra. Every API grants
  new accounts a one-time 10,000 free requests (not a recurring monthly free
  tier). Yearly billing is discounted ~20% (Whois and Domain Score are
  advertised as "two months free").
